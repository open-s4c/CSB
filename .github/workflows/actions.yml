name: CSB actions
on: [workflow_dispatch, push, pull_request]

jobs:
  Run-bm-generator:
    runs-on: ubuntu-latest
    steps:
      - name: install pre-requisites
        run: sudo apt-get install -y libhiredis-dev
      - name: Test Builtin Benchmarks
        uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test bm-generator
        run: |
          go env -w GOBIN=$HOME/.local/bin
          strace --version
          cd bm-generator/
          ./test.sh
      - name: Upload strace log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls_strace
          path: ${{ github.workspace }}/bm-generator/ls_strace.log


  # Checks if cmake and C files are properly formatted
  Check-Format:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [clang-format-apply, cmake-format-apply, json-format-apply]
    steps:
      - name: Install cmake-format for cmake-format-check
        if: matrix.target == 'cmake-format-apply'
        run: pip install cmakelang
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure
        run: cmake -S. -Bbuild -DCSB_BM_GENERATOR=ON
      - name: Run ${{ matrix.target }}
        run: cmake --build build --target ${{ matrix.target }}
      - name: Check things match expectation
        run: cmake --build build --target git-diff-check ||
            (echo "Run 'make ${{ matrix.target }}' and commit" && false)

  # Checks python files with ruff linter
  Check-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Test Builtin Benchmarks
        uses: actions/checkout@v4
      - name: Use ruff
        uses: astral-sh/ruff-action@v3
      - name: Run ruff
        run: ruff check bm-runner

  # Checks python files' format with black
  Check-Black:
    runs-on: ubuntu-latest
    steps:
      - name: Test Builtin Benchmarks
        uses: actions/checkout@v4
      - name: Run Black
        uses: psf/black@stable
        with:
          options: "-l 100 --check --verbose"
          src: "./bm-runner"
          version: "~= 25.12"

  # Checks python files with Ty type checker
  Check-ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ty
        run: pip install ty
      - name: Run Ty
        run: ./scripts/configure.sh && ty check --venv ./venv ./bm-runner

  # Checks if the config documentation is up to date
  Check-Documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run documentation script
        run: ./scripts/configure.sh && ./helpers/update-doc.sh && git --no-pager diff --exit-code

  Run-Python-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run Tests
        run: |
         ./scripts/configure.sh
         helpers/python-tests.sh

  # Run a dummy benchmark to ensure bm-runner works
  Run-Benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        benchmark:
          -  { prefix: "", prepare_cmd: "" , config: bm_empty }
          -  { prefix: "", prepare_cmd: "" , config: bm_server_redis }
          -  { prefix: "", prepare_cmd: "" , config: rocksdb/rocksdb_aggregated }
          -  { prefix: "", prepare_cmd: "" , config: mysql/mysql-aggregated }
          -  { prefix: "", prepare_cmd: "" , config: mysql/mysql-aggregated }
          -  { prefix: "CSB_BPFTRACE_FILTER='/ comm == \"runc\" /'", prepare_cmd: "./scripts/bm-external/cgroups/prepare.sh" , config: bm-external/cgroups/runc }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pre-requisites
        run: |
          sudo apt update
          sudo apt-get install -y build-essential cmake libhiredis-dev bubblewrap
      - name: Enable bwrap user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w user.max_user_namespaces=15000 || true
      - name: Satisfy Specific Prerequisites
        run: |
          ${{ matrix.benchmark.prepare_cmd }}
      - name: Run Benchmark ${{ matrix.benchmark.config }}
        run: |
          ${{ matrix.benchmark.prefix }} ./scripts/run-single.sh config/${{ matrix.benchmark.config }}.json
      - name: Fix artifact permissions
        if: always()
        run: |
          sudo chmod -R a+r results/
          sudo chmod -R a+r build/bench/

      - name: Create unique name
        run: echo "ARTIFACT_NAME=$(echo '${{ matrix.benchmark.config }}' | tr '/' '_')" >> $GITHUB_ENV

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ env.ARTIFACT_NAME }}
          path: |
            results/
            build/bench/

  Run-External-Benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        benchmark:
          - { extern: byte-unixbench, dir: bm-external/byte-unixbench, config: syscall }
          - { extern: will-it-scale, dir: bm-external/, config: will-it-scale }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pre-requisites
        run: |
          sudo apt update
          sudo apt-get install -y build-essential cmake libhiredis-dev libhwloc-dev
      - name: Prepare benchmark
        run: |
          ./scripts/bm-external/${{ matrix.benchmark.extern }}/configure.sh
      - name: Run Benchmark ${{ matrix.benchmark.config }}
        run: |
          ./scripts/run-single.sh config/${{ matrix.benchmark.dir }}/${{ matrix.benchmark.config }}.json
      - name: Fix artifact permissions
        if: always()
        run: sudo chmod -R a+r results/
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.benchmark.config }}
          path: |
            results/
            build/bench

  Check-Submodule-Commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Extract submodule commit SHA
        id: sub
        run: |
          # Path to your submodule
          SUBMODULE_PATH="deps/syzkaller"
          # Get the commit SHA the submodule is pinned to
          SHA=$(git -C "$SUBMODULE_PATH" rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Submodule commit: $SHA"
      - name: Fetch upstream s4c/csb-dev branch
        run: |
          # Clone our syzkaller fork
          git clone https://github.com/open-s4c/syzkaller.git
          cd syzkaller
          git fetch origin s4c/csb-dev
      - name: Check if submodule SHA exists on upstream s4c/csb-dev
        run: |
          SHA="${{ steps.sub.outputs.sha }}"
          cd syzkaller
          # Check if SHA is reachable from s4c/csb-dev
          if git merge-base --is-ancestor "$SHA" origin/s4c/csb-dev; then
            echo "✔ Submodule commit exists on upstream s4c/csb-dev"
          else
            echo "❌ Submodule commit does NOT exist on upstream s4c/csb-dev"
            exit 1
          fi
